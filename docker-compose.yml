version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: jmb_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmb_web_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/jersey_mention_bd
      - JWT_SECRET=jersey_mention_bd_jwt_super_secret_key_2026
      - JWT_REFRESH_SECRET=jersey_mention_bd_refresh_secret_key_2026
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      - mongodb
    restart: always

volumes:
  uploads_data:
  mongodb_data:
